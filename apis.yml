name: Eversports
description: >-
  Eversports is a European sports and fitness platform that lets consumers
  discover and book classes, courts, and memberships across studios, gyms, and
  clubs, and gives those businesses a back-office management suite (Eversports
  Manager) for scheduling, bookings, payments, and customer management.
  Eversports Manager exposes two public GraphQL APIs: a read-only Provider API
  that serves a venue's activity schedules (classes, trainings, workshops,
  courses, events, retreats, camps, educations) with venue, teacher, room, sport,
  and availability detail; and an Aggregator API that exposes venues, classes,
  sessions, and reservations plus mutations to make, cancel, and check in
  reservations for aggregator partners. Both APIs authenticate with a Bearer
  token issued by Eversports and use Relay-style cursor pagination.
